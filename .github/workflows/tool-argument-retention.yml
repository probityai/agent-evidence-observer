name: Recover exact tool-argument preparation archive

on:
  push:
    branches: [chore/tool-argument-retention-2026-10-03]
    paths: ['interop/artifact-retention-2026-10-03/**', '.github/workflows/tool-argument-retention.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  retain-original:
    if: github.repository == 'probityai/agent-evidence-observer'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install custody verification tools
        run: python -m pip install pytest==8.3.3 hypothesis==6.168.3 ruff==0.15.8
      - name: Check byte custody and refusal controls
        run: |
          python -B -m pytest interop/artifact-retention-2026-10-03/tests -q
          python -m ruff check --select C901 --config 'lint.mccabe.max-complexity=5' interop/artifact-retention-2026-10-03
      - name: Retrieve and verify original archive without executing its contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -B interop/artifact-retention-2026-10-03/retain_archive.py "$RUNNER_TEMP/tool-argument-retention"
      - name: Retain complete transfer and member verification manifests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tool-argument-retention-manifest
          path: ${{ runner.temp }}/tool-argument-retention/metadata/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Retain exact original byte range 000
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tool-argument-retention-part-000
          path: ${{ runner.temp }}/tool-argument-retention/parts/part-000.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Retain exact original byte range 001
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02

name: Evaluation history

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,inspect]'
      - run: python -m pytest -q tests/test_evaluation_history.py tests/test_inspect_history.py tests/test_eval_adversarial.py
      - run: python examples/evaluation_history_demo.py --output-dir evaluation-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evaluation-run
          path: evaluation-run/
